<svg width="1500" height="500" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1a1a"/>
      <stop offset="0.55" stop-color="#0a1212"/>
      <stop offset="1" stop-color="#08100f"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fe3cf"/>
      <stop offset="1" stop-color="#0e9c90"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#12b5a5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#12b5a5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0 L0 0 0 46" fill="none" stroke="#1d3634" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#grid)"/>
  <rect width="1500" height="500" fill="url(#glow)"/>
  <!-- monogram tile -->
  <rect x="150" y="150" width="150" height="150" rx="38" fill="#0c1414" stroke="#12b5a5" stroke-opacity="0.25" stroke-width="3"/>
  <rect x="185" y="190" width="80" height="20" rx="6" fill="url(#teal)"/>
  <rect x="215" y="190" width="20" height="72" rx="6" fill="url(#teal)"/>
  <!-- wordmark + tagline -->
  <text x="345" y="258" font-family="'DejaVu Sans','Noto Sans','Liberation Sans',Arial,sans-serif" font-size="104" font-weight="700" fill="#eafaf8">teknakul</text>
  <text x="350" y="318" font-family="'DejaVu Sans','Noto Sans','Liberation Sans',Arial,sans-serif" font-size="34" font-weight="400" fill="#7fb8b2">Confident, AI-augmented operators of the Modern Workplace</text>
</svg>
